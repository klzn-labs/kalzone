{{define "content"}}
{{$csrf := .Viewer.CSRFToken}}
<div class="page-header">
  <div>
    <div class="eyebrow"><a href="/people">People</a> / @{{.Viewer.Actor.Login}}</div>
    <h1>Change password</h1>
    <p class="lead">Your other sessions are signed out. Your access tokens keep working.</p>
  </div>
</div>

<form class="card" method="post" action="/account/password" style="max-width:520px">
  {{template "csrf" $csrf}}
  <div class="card-body">
    {{with .Data.Error}}<div class="alert alert-danger" style="margin-bottom:16px">{{icon "alert"}}<span>{{.}}</span></div>{{end}}
    <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
    <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><span class="hint">12 to 128 characters.</span></div>
    <div class="field"><label for="confirm">New password again</label><input id="confirm" name="confirm" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></div>
    <div class="form-actions"><button class="btn btn-primary">{{icon "key"}}Change password</button></div>
  </div>
</form>
{{end}}
