name: Release

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Rollout strategy
        type: choice
        options: [canary, bluegreen]
        default: bluegreen

concurrency:
  group: release-controlplane
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push the control plane
        run: |
          docker build --target controlplane --build-arg VERSION=${{ github.sha }} -t adrianozdp/platform-controlplane:${{ github.sha }} .
          docker push adrianozdp/platform-controlplane:${{ github.sha }}
      - name: Build and push the agent
        run: |
          docker build --target agent --build-arg VERSION=${{ github.sha }} -t adrianozdp/platform-agent:${{ github.sha }} .
          docker push adrianozdp/platform-agent:${{ github.sha }}
      - name: Build and push the queue gateway
        run: |
          docker build --target queued --build-arg VERSION=${{ github.sha }} -t adrianozdp/platform-queued:${{ github.sha }} .
          docker push adrianozdp/platform-queued:${{ github.sha }}

  install-deployctl:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: adrianozp/infra-plateful
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: ./.github/actions/install-deployctl
        with:
          vps_host: ${{ secrets.VPS_HOST }}
          vps_user: ${{ secrets.VPS_USER }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}

  deploy:
    needs: [publish, install-deployctl]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-controlplane
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: adrianozp/infra-plateful
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: ./.github/actions/deploy
        with:
          service: controlplane
          image: adrianozdp/platform-controlplane:${{ github.sha }}
          version: ${{ github.sha }}
          strategy: ${{ inputs.strategy }}
          vps_host: ${{ secrets.VPS_HOST }}
          vps_user: ${{ secrets.VPS_USER }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
