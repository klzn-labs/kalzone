name: Release

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Rollout strategy
        type: choice
        options: [canary, bluegreen]
        default: bluegreen

concurrency:
  group: release-controlplane
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list -R "${{ github.repository }}" --workflow ci.yml --commit "${{ github.sha }}" --status success --json databaseId --jq length)
          if [ "$runs" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: ci
    if: needs.ci.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-release-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-release-${{ hashFiles('go.sum') }}-
            go-release-
      - name: Build the binaries
        run: sh scripts/build-binaries.sh ${{ github.sha }} out
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push the control plane
        run: |
          docker build --target controlplane --build-arg BINARIES=prebuilt --build-arg VERSION=${{ github.sha }} -t adrianozdp/platform-controlplane:${{ github.sha }} .
          docker push adrianozdp/platform-controlplane:${{ github.sha }}
      - name: Build and push the agent
        run: |
          docker build --target agent --build-arg BINARIES=prebuilt --build-arg VERSION=${{ github.sha }} -t adrianozdp/platform-agent:${{ github.sha }} .
          docker push adrianozdp/platform-agent:${{ github.sha }}
      - name: Build and push the queue gateway
        run: |
          docker build --target queued --build-arg BINARIES=prebuilt --build-arg VERSION=${{ github.sha }} -t adrianozdp/platform-queued:${{ github.sha }} .
          docker push adrianozdp/platform-queued:${{ github.sha }}

  install-deployctl:
    needs: [ci, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: klzn-labs/kalzone-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: ./.github/actions/install-deployctl
        with:
          vps_host: ${{ secrets.VPS_HOST }}
          vps_user: ${{ secrets.VPS_USER }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}

  deploy:
    needs: [publish, install-deployctl]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: deploy-controlplane
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: klzn-labs/kalzone-infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
      - uses: ./.github/actions/deploy
        with:
          service: controlplane
          image: adrianozdp/platform-controlplane:${{ github.sha }}
          version: ${{ github.sha }}
          strategy: ${{ inputs.strategy }}
          vps_host: ${{ secrets.VPS_HOST }}
          vps_user: ${{ secrets.VPS_USER }}
          vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
